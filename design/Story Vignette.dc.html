<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/didi-build-design-system-b51779c8-dac0-4a13-a587-18bef5d1ac59/tokens/fonts.css">
<link rel="stylesheet" href="_ds/didi-build-design-system-b51779c8-dac0-4a13-a587-18bef5d1ac59/tokens/colors.css">
<link rel="stylesheet" href="_ds/didi-build-design-system-b51779c8-dac0-4a13-a587-18bef5d1ac59/tokens/typography.css">
<link rel="stylesheet" href="_ds/didi-build-design-system-b51779c8-dac0-4a13-a587-18bef5d1ac59/tokens/spacing.css">
<script src="_ds/didi-build-design-system-b51779c8-dac0-4a13-a587-18bef5d1ac59/_ds_bundle.js"></script>
</helmet>
<div aria-hidden="true" style="width:100%;max-width:300px;margin:0 auto;font-family:var(--font-sans);color:var(--ink);text-align:left">
  <sc-if value="{{ isLink }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 20px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line)">
      <div style="padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);line-height:0">{{ qr }}</div>
      <div style="display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;min-height:40px;padding:0 6px 0 14px;border-radius:999px;background:var(--surface-2)">
        <span style="flex:1;min-width:0;font:500 13px/1.2 var(--font-sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">we-met.link/hi/your-name</span>
        <span style="flex:none;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;background:var(--surface);color:var(--ink-muted)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 012-2h10"></path></svg></span>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isForm }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:10px;padding:10px 18px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)">
      <span style="align-self:center;width:32px;height:4px;border-radius:999px;background:var(--line-strong)"></span>
      <p style="margin:4px 0 2px;font:600 17px/1.2 var(--font-sans);letter-spacing:-0.02em">Let's stay in touch</p>
      <div style="display:flex;flex-direction:column;gap:2px;padding:7px 12px 8px;border-radius:10px;background:var(--surface-2)">
        <span style="font:500 11px/1.3 var(--font-sans);color:var(--ink-muted)">Full name</span>
        <span style="font:400 14px/1.35 var(--font-sans)">Sam Rivera</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;padding:7px 12px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--accent);box-shadow:0 0 0 1px var(--accent)">
        <span style="font:500 11px/1.3 var(--font-sans);color:var(--accent-text)">Email</span>
        <span style="font:400 14px/1.35 var(--font-sans)">sam@studio.co</span>
      </div>
      <span style="display:flex;align-items:center;justify-content:center;min-height:40px;margin-top:4px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 14px/1 var(--font-sans)">Exchange contact</span>
    </div>
  </sc-if>
  <sc-if value="{{ isLead }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font:600 12px/1.3 var(--font-sans);color:var(--ink-muted)">To you</span>
      <div style="display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)">
        <span style="flex:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 11px/1 var(--font-sans)">WM</span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <div style="display:flex;justify-content:space-between;gap:8px;font:500 12px/1.3 var(--font-sans);color:var(--ink-muted)"><span>We Met</span><span>now</span></div>
          <span style="font:600 14px/1.3 var(--font-sans)">New lead: Sam Rivera</span>
          <span style="font:400 13px/1.35 var(--font-sans);color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">sam@studio.co</span>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isCard }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font:600 12px/1.3 var(--font-sans);color:var(--ink-muted)">To Sam</span>
      <div style="display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)">
        <span style="flex:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);box-sizing:border-box;font:700 11px/1 var(--font-sans)">YN</span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <div style="display:flex;justify-content:space-between;gap:8px;font:500 12px/1.3 var(--font-sans);color:var(--ink-muted)"><span>Your Name</span><span>now</span></div>
          <span style="font:600 14px/1.3 var(--font-sans)">Nice to meet you, Sam</span>
          <span style="align-self:flex-start;display:flex;align-items:center;gap:6px;margin-top:6px;padding:5px 10px 5px 8px;border-radius:8px;background:var(--surface-2);font:500 12px/1.2 var(--font-sans)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16c.6-1.4 1.7-2 3-2s2.4.6 3 2M14 10h4M14 14h3"></path></svg>Contact card</span>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:320},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;link&quot;,&quot;form&quot;,&quot;lead&quot;,&quot;card&quot;],&quot;default&quot;:&quot;link&quot;,&quot;tsType&quot;:&quot;'link' | 'form' | 'lead' | 'card'&quot;}}">
class Component extends DCLogic {
  qrSvg() {
    if (this._qr) return this._qr;
    const N = 21, E = React.createElement, cells = [];
    let seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const finder = (x, y) => [x, y].every((v) => v < 7) || (x >= N - 7 && y < 7) || (x < 7 && y >= N - 7);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (finder(x, y)) continue;
      if (rnd() > 0.52) cells.push(E('rect', { key: x + '-' + y, x, y, width: 1, height: 1 }));
    }
    const fin = (x, y, k) => E('g', { key: k }, E('rect', { x: x + 0.5, y: y + 0.5, width: 6, height: 6, rx: 1.4, fill: 'none', stroke: 'currentColor', strokeWidth: 1 }), E('rect', { x: x + 2, y: y + 2, width: 3, height: 3, rx: 0.6 }));
    this._qr = E('svg', { width: 104, height: 104, viewBox: '0 0 21 21', fill: 'currentColor', shapeRendering: 'crispEdges' }, fin(0, 0, 'a'), fin(N - 7, 0, 'b'), fin(0, N - 7, 'c'), ...cells);
    return this._qr;
  }
  renderVals() {
    const k = this.props.kind ?? 'link';
    return { isLink: k === 'link', isForm: k === 'form', isLead: k === 'lead', isCard: k === 'card', qr: k === 'link' ? this.qrSvg() : null };
  }
}
</script>
</body>
</html>
