<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We Met app: coming soon</title>
<meta name="description" content="The We Met app is coming soon.">
<meta property="og:title" content="We Met">
<meta property="og:description" content="The We Met app is coming soon.">
<meta property="og:image" content="https://we-met.link/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="icons/we-met-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="landing.css">
</head>
<body>
<div class="lp" id="lp-root">
  <div class="lp-glow" aria-hidden="true"></div>
  <header class="lp-wrap lp-header">
    <a class="lp-brand" href="https://we-met.link" aria-label="We Met home"><span class="lp-icon" data-icon="we-met-mark" data-size="26" aria-hidden="true"></span>We Met</a>
  </header>
  <main class="lp-wrap lp-soon">
    <span class="lp-icon" data-icon="we-met-mark" data-size="56" aria-hidden="true"></span>
    <h1 class="lp-h2">The We Met app is coming soon.</h1>
    <p class="lp-body">Making and editing your card will happen here. Until then, you can see what a card looks like.</p>
    <div class="lp-actions">
      <a class="lp-btn" href="https://we-met.link">Back to we-met.link</a>
      <a class="lp-link" href="https://we-met.link/hi/didi">See an example</a>
    </div>
  </main>
  <footer class="lp-wrap">
    <div class="lp-footer-in">
      <div class="lp-footer-left">
        <span class="lp-footer-brand"><span class="lp-icon" data-icon="we-met-mark" data-size="20" aria-hidden="true"></span>We Met</span>
        <span class="lp-credit">Free digital business cards, made by <a class="lp-credit-link" href="https://didi.build"><span class="lp-icon" data-icon="didi-build-leaf" data-size="12" aria-hidden="true"></span>Didi Build</a>.</span>
      </div>
      <button type="button" class="lp-toggle" role="switch" aria-checked="false" aria-label="Dark mode" data-theme-toggle>
        <span class="lp-track" aria-hidden="true"><span class="lp-knob"><span class="lp-icon lp-sun" data-icon="sun" data-size="13" aria-hidden="true"></span><span class="lp-icon lp-moon" data-icon="moon" data-size="12" aria-hidden="true"></span></span></span>
      </button>
    </div>
  </footer>
</div>
<script src="landing.js"></script>
</body>
</html>
