schema_version: 1
d1_tables:
  accounts:
    defaults:
      storage: D1
      processors:
        - Cloudflare
      verified: true
    columns:
      contact_added_at:
        whose: card_owner
        data: Timestamp when contacts setup last completed successfully
        purpose: hide contacts setup row after success
        retention: until account tombstone; cleared on account deletion runbook
        who_can_see: operator
        source: src/app-auth/google-people-api.ts
      contact_sender_addresses:
        whose: card_owner
        data: JSON array of We Met sender addresses recorded on the owner account (no
          Google tokens)
        purpose: contacts setup reappear when config adds a new sender
        retention: until account tombstone; cleared on account deletion runbook
        who_can_see: operator
        source: src/app-auth/google-people-api.ts
      created_at:
        whose: operational
        data: Account creation timestamp (ISO-8601 UTC)
        purpose: audit and support
        retention: until account tombstone
        who_can_see: operator
        source: src/app-auth/accounts.ts
      email:
        whose: card_owner
        data: Google account email (normalized lowercase)
        purpose: sign-in, owner lead sink resolution, reply-to and vCard in visitor
          email
        retention: until account tombstone (blanked on delete)
        who_can_see: operator; visitors who exchange details (follow-up email and vCard
          attachment, POST /api/exchange success JSON ownerEmail, or POST
          /api/exchange/vcard with a valid details token, including when
          lead_email_enabled is off; not on the public /hi page payload before
          exchange)
        source: src/app-auth/accounts.ts
      google_sub:
        whose: card_owner
        data: Google account subject identifier
        purpose: sign-in identity and uniqueness
        retention: until account tombstone (replaced with deleted:<id>)
        who_can_see: operator
        source: src/app-auth/accounts.ts
      id:
        whose: operational
        data: Account UUID
        purpose: primary key and foreign-key target
        retention: until account tombstone after deletion request
        who_can_see: operator
        source: src/app-auth/accounts.ts
      last_login_at:
        whose: operational
        data: Last successful sign-in timestamp
        purpose: security and support
        retention: until account tombstone
        who_can_see: operator
        source: src/app-auth/accounts.ts
      name:
        whose: card_owner
        data: Google account display name (full name at sign-in; seeds card contact.name
          parts used in visitor email)
        purpose: app UI, default card naming, visitor follow-up From and signature when
          contact fields match Google profile
        retention: until account tombstone (blanked on delete)
        who_can_see: operator; public card visitors when used as display fallback;
          visitors who exchange (Google first name in email From "{given} via We
          Met", signature given/nickname/family per privacy page)
        source: src/app-auth/accounts.ts
      status:
        whose: operational
        data: Account lifecycle status
        purpose: access control (waitlisted, active, suspended, deleted)
        retention: until account tombstone
        who_can_see: operator
        source: src/app-auth/accounts.ts
      updated_at:
        whose: operational
        data: Account last update timestamp
        purpose: audit and support
        retention: until account tombstone
        who_can_see: operator
        source: src/app-auth/accounts.ts
  app_settings:
    defaults:
      whose: operational
      purpose: feature flags
      storage: D1
      processors:
        - Cloudflare
      who_can_see: operator
      source: src/app-auth/app-settings.ts
      verified: true
    columns:
      key:
        data: Setting name (e.g. signups_open, lead_email_enabled, email_provider)
        retention: indefinite (no purge job in repo)
      value:
        data: Setting value string
        retention: indefinite
  card_drafts:
    defaults:
      storage: D1
      processors:
        - Cloudflare
      who_can_see: operator
      verified: true
    columns:
      account_id:
        whose: operational
        data: Account UUID
        purpose: one draft row per account
        retention: until publish or account deletion runbook removes row
        source: migrations/0004_mvp_accounts_additive.sql
      draft_json:
        whose: card_owner
        data: Serialized unpublished card editor state (display name, role, about,
          services, links, contact including optional phone, copy)
        purpose: autosave while editing
        retention: until publish or account deletion
        source: src/card-data/types.ts
      photo_key:
        whose: card_owner
        data: R2 object key (SHA-256 hex) for draft card photo
        purpose: draft photo reference
        retention: until publish replaces key or account deletion
        source: src/images/ingest-card-photo.ts
      updated_at:
        whose: operational
        data: Draft last save timestamp
        purpose: autosave ordering
        retention: same as draft row
        source: migrations/0004_mvp_accounts_additive.sql
  cards:
    defaults:
      storage: D1
      processors:
        - Cloudflare
      source: migrations/0005_cards_rebuild_mvp.sql
      verified: true
    columns:
      account_id:
        whose: operational
        data: Owning account UUID
        purpose: ownership
        retention: until account tombstone
        who_can_see: operator
      contact_json:
        whose: card_owner
        data: Structured contact JSON (given and family from Google sign-in by default,
          optional nickname, org, title, phone, vcard note, URLs)
        purpose: visitor follow-up From display (given), signature
          (ownerEmailDisplayName), and server-built vCard; not sent to the
          browser on public /hi before exchange
        retention: until card retired
        who_can_see: operator; not serialized on public /hi before exchange (see
          src/lib/hi-card/public-card-payload.ts); visitors after exchange via
          follow-up email From, signature, body, and vCard attachment, POST
          /api/exchange success JSON ownerEmail and ownerPhone when present, or
          POST /api/exchange/vcard with a valid details token (including when
          lead_email_enabled is off)
      copy_json:
        whose: operational
        data: UI strings for exchange sheet (no visitor PII)
        purpose: localized UI copy
        retention: until card retired
        who_can_see: public visitors
      display_name:
        whose: card_owner
        data: Public display name on card
        purpose: public card and visitor follow-up email body
        retention: until card retired
        who_can_see: public visitors on /hi only as the published name fallback when
          page_copy name is missing (serialized as name, not display_name);
          visitors who exchange (email body when set, else Google name fallback)
      id:
        whose: operational
        data: Card UUID
        purpose: primary key
        retention: until card retired or account deleted
        who_can_see: operator
      links_json:
        whose: card_owner
        data: Public social and website links JSON
        purpose: public card
        retention: until card retired
        who_can_see: public visitors on /hi for website, linkedin, github, and instagram
          URLs only (bookingUrl is not sent to the browser; see
          src/lib/hi-card/public-card-payload.ts)
      page_copy_json:
        whose: card_owner
        data: Page metadata copy JSON (titles, alt text)
        purpose: public card and email templates
        retention: until card retired
        who_can_see: public visitors on /hi for name, role, about, services, links,
          alternate, and headshotAlt (serialized by
          src/lib/hi-card/public-card-payload.ts); pageTitle in HTML title and
          OG/Twitter tags only (not in client card props); emailFromName not
          sent to the browser (email templates only)
      photo_key:
        whose: card_owner
        data: R2 object key for published card photo
        purpose: public card image
        retention: until replaced, retired, or account deletion
        who_can_see: operator; public visitors receive photo bytes at
          /hi/<slug>/photo.jpg only (R2 key not sent to the browser on public
          /hi; see src/lib/hi-card/public-card-payload.ts)
      slug:
        whose: card_owner
        data: Public URL slug (/hi/<slug>)
        purpose: routing and sharing
        retention: reserved while account exists (retired slug stays taken)
        who_can_see: public visitors
      status:
        whose: operational
        data: Card lifecycle (live, suspended, retired)
        purpose: access control
        retention: until account tombstone
        who_can_see: operator
      updated_at:
        whose: operational
        data: Card last publish/update timestamp
        purpose: audit
        retention: until card retired
        who_can_see: operator
      variant:
        whose: card_owner
        data: Brand variant (green or mono)
        purpose: theming
        retention: until card retired
        who_can_see: operator; v1 public /hi does not send variant to the browser (mono
          palette only via hi-theme-bootstrap); not visible on public /hi
  contacts_oauth_attempts:
    defaults:
      whose: operational
      storage: D1
      processors:
        - Cloudflare
      who_can_see: operator
      source: src/app-auth/contacts-oauth-attempts.ts
      verified: true
    columns:
      account_id:
        data: Account UUID bound to the contacts OAuth attempt
        purpose: tie contacts consent to signed-in owner
        retention: same as contacts_oauth_attempt row
      created_at:
        data: Contacts OAuth attempt creation time
        purpose: audit
        retention: same as contacts_oauth_attempt row
      expires_at:
        data: Contacts OAuth attempt expiry (10 minutes)
        purpose: limit replay window
        retention: same as contacts_oauth_attempt row; expired rows deleted on purge
      pkce_verifier:
        data: PKCE code verifier for contacts OAuth
        purpose: Google OAuth security
        retention: same as contacts_oauth_attempt row
      state_hash:
        data: SHA-256 base64url hash of contacts OAuth state parameter
        purpose: CSRF protection for Google contacts incremental auth
        retention: 10 minutes from created_at; row removed on successful callback
          consume or when expired rows are purged
  daily_send_counts:
    defaults:
      whose: operational
      storage: D1
      processors:
        - Cloudflare
      retention: indefinite (no scheduled purge in repo)
      who_can_see: operator
      source: src/lead-email/daily-send-counts.ts
      verified: true
    columns:
      card_id:
        data: Card UUID
        purpose: per-card send accounting
      count:
        data: Emails sent that day for card and kind
        purpose: abuse and deliverability limits
      day:
        data: UTC calendar day (YYYY-MM-DD)
        purpose: rate-cap window key
      kind:
        data: Counter kind (owner or visitor email)
        purpose: separate caps
  hostnames:
    defaults:
      whose: operational
      storage: D1
      processors:
        - Cloudflare
      who_can_see: operator
      source: migrations/0001_card_lookup_schema.sql
      verified: true
    columns:
      card_id:
        data: Card UUID reference
        purpose: hostname routing
        retention: same as hostname row
      hostname:
        data: Custom hostname string for card routing
        purpose: hostname-to-card lookup
        retention: until hostname removed or card cascade delete
  lead_delivery_ledger:
    defaults:
      whose: operational
      storage: D1
      processors:
        - Cloudflare
      retention: indefinite (kept after account deletion per ADR 0025 and privacy page)
      who_can_see: operator
      verified: true
    columns:
      attempt_count:
        data: Delivery attempts
        purpose: retry policy
        source: docs/decisions/0022-lead-delivery-ledger.md
      card_id:
        data: Card UUID
        purpose: per-card delivery stats
        source: docs/decisions/0022-lead-delivery-ledger.md
      created_at:
        data: Row creation time
        purpose: audit
        source: docs/decisions/0022-lead-delivery-ledger.md
      error_code:
        data: Failure code if failed
        purpose: support
        source: docs/decisions/0022-lead-delivery-ledger.md
      external_ref:
        data: Opaque flat JSON from email sink after send — Cloudflare path { provider,
          messageId } (legacy rows may include gmailMessageId and gmailThreadId;
          no visitor PII)
        purpose: record-to-append threading handoff and operator correlation
        source: src/followup-email-consumer/lead-sink/email-handler.ts
      gmail_message_id:
        data: Legacy Gmail API message id column (schema from migration 0002; consumer
          markSent does not write it at HEAD)
        purpose: reserved; correlation lives in external_ref
        source: src/followup-email-consumer/lead-delivery-ledger.ts
      gmail_thread_id:
        data: Legacy Gmail API thread id column (schema from migration 0002; consumer
          markSent does not write it at HEAD)
        purpose: reserved; correlation lives in external_ref
        source: src/followup-email-consumer/lead-delivery-ledger.ts
      id:
        data: Ledger row UUID
        purpose: idempotency and status tracking
        source: docs/decisions/0022-lead-delivery-ledger.md
      lead_id:
        data: Opaque lead correlation id (not visitor PII)
        purpose: tie record and append phases
        source: docs/decisions/0022-lead-delivery-ledger.md
      next_attempt_at:
        data: Scheduled retry time
        purpose: consumer backoff
        source: docs/decisions/0022-lead-delivery-ledger.md
      phase:
        data: Delivery phase (record or append)
        purpose: two-phase email sink
        source: docs/decisions/0022-lead-delivery-ledger.md
      retry_until:
        data: Retry budget deadline
        purpose: queue retention alignment
        source: docs/decisions/0022-lead-delivery-ledger.md
      sent_at:
        data: Successful send time
        purpose: audit
        source: docs/decisions/0022-lead-delivery-ledger.md
      sink_id:
        data: Lead sink UUID
        purpose: per-sink delivery
        source: docs/decisions/0022-lead-delivery-ledger.md
      sink_kind:
        data: Sink kind string
        purpose: handler routing
        source: docs/decisions/0022-lead-delivery-ledger.md
      status:
        data: queued, sent, or failed
        purpose: retry and ops
        source: docs/decisions/0022-lead-delivery-ledger.md
      updated_at:
        data: Row update time
        purpose: audit
        source: docs/decisions/0022-lead-delivery-ledger.md
  lead_sinks:
    defaults:
      storage: D1
      processors:
        - Cloudflare
      retention: until sink deleted or account deletion runbook
      who_can_see: operator
      source: src/card-data/lead-sink-kinds/email.ts
      verified: true
    columns:
      card_id:
        whose: operational
        data: Card UUID
        purpose: per-card sinks
      config_json:
        whose: card_owner
        data: "Sink config JSON (v1: {to: account_email} sentinel, resolved to
          accounts.email at enqueue)"
        purpose: delivery target resolution
      created_at:
        whose: operational
        data: Row creation time
        purpose: audit
      enabled:
        whose: operational
        data: Whether sink is active
        purpose: dispatch gating
      id:
        whose: operational
        data: Lead sink UUID
        purpose: sink dispatch
      kind:
        whose: operational
        data: Sink kind (email in v1)
        purpose: handler selection
      updated_at:
        whose: operational
        data: Row update time
        purpose: audit
  oauth_attempts:
    defaults:
      whose: operational
      storage: D1
      processors:
        - Cloudflare
      who_can_see: operator
      source: src/app-auth/sessions.ts
      verified: true
    columns:
      created_at:
        data: OAuth attempt start time
        purpose: expiry calculation
        retention: same as oauth_attempt row
      expires_at:
        data: OAuth attempt expiry (10 minutes)
        purpose: limit replay window
        retention: same as oauth_attempt row
      mode:
        data: OAuth UI mode (redirect or popup)
        purpose: routing callback response
        retention: same as oauth_attempt row
      nonce:
        data: OpenID Connect nonce for ID token validation
        purpose: Google sign-in security
        retention: same as oauth_attempt row
      pkce_verifier:
        data: PKCE code verifier
        purpose: Google OAuth security
        retention: same as oauth_attempt row
      state_hash:
        data: SHA-256 base64url hash of OAuth state parameter
        purpose: CSRF protection for Google OAuth
        retention: 10 minutes from created_at; row removed on successful callback
          consume only
  photo_upload_log:
    defaults:
      whose: operational
      storage: D1
      processors:
        - Cloudflare
      who_can_see: operator
      verified: true
    columns:
      account_id:
        data: Account UUID
        purpose: rate-limit key for photo uploads
        retention: until account deletion runbook deletes rows; no TTL job
        source: migrations/0006_photo_upload_log.sql
      uploaded_at:
        data: Upload timestamp
        purpose: per-day upload cap (10 per UTC day)
        retention: same as photo_upload_log row
        source: src/app/api/app/photo/route.ts
  sessions:
    defaults:
      whose: operational
      storage: D1
      processors:
        - Cloudflare
      who_can_see: operator
      source: src/app-auth/sessions.ts
      verified: true
    columns:
      absolute_expires_at:
        data: Hard session cap (90 days from creation)
        purpose: session timeout
        retention: same as session row
      account_id:
        data: Account UUID reference
        purpose: tie session to account
        retention: same as session row
      created_at:
        data: Session creation time
        purpose: audit
        retention: same as session row
      expires_at:
        data: Sliding session expiry (30 days from last touch)
        purpose: session timeout
        retention: same as session row
      last_seen_at:
        data: Last authenticated request time
        purpose: sliding window refresh
        retention: same as session row
      token_hash:
        data: SHA-256 base64url hash of session cookie token
        purpose: session lookup
        retention: until sliding or absolute expiry, or explicit logout; row deleted on
          failed validation
other_items:
  - id: abuse.client_ip_rate_limit
    whose: visitor
    data: Client IP from cf-connecting-ip used as rate limiter key
    purpose: abuse protection on exchange and auth routes
    storage: Cloudflare Rate Limiting binding (in-memory per period, not D1)
    processors:
      - Cloudflare
    retention: unknown (limiter window 60s per wrangler.jsonc; vendor retention unknown)
    who_can_see: Cloudflare
    source: src/exchange/client-ip.ts
    verified: false
  - id: abuse.turnstile
    whose: visitor
    data: Turnstile response token and client IP sent to Cloudflare siteverify
    purpose: bot protection on exchange
    storage: Cloudflare Turnstile (transit)
    processors:
      - Cloudflare
    retention: unknown (Cloudflare Turnstile data handling not documented in repo)
    who_can_see: Cloudflare
    source: src/exchange/turnstile.ts
    verified: false
  - id: api.exchange_post_success_body
    whose: card_owner
    data: JSON fields ownerEmail (accounts.email) and optional ownerPhone
      (contact_json.phone) returned with the details token after POST
      /api/exchange
    purpose: show owner contact on the visitor receipt without putting inbox or
      phone in the public page payload
    storage: not persisted; JSON response only
    processors:
      - Cloudflare
    retention: none
    who_can_see: visitor who completed exchange step 1 in that tab
    source: src/exchange/process-exchange.ts
    verified: false
  - id: api.exchange_vcard_response
    whose: card_owner
    data: Owner vCard (name, org, title, work email, optional phone, URLs, note,
      optional JPEG photo) returned after valid exchange details token
    purpose: let visitor save owner contact after exchange without a public .vcf URL
    storage: not persisted; streamed in HTTP response only
    processors:
      - Cloudflare
    retention: none (no-store response)
    who_can_see: visitor who holds a valid details token within TTL
    source: src/app/api/exchange/vcard/route.ts
    verified: false
  - id: auth.google_contacts
    whose: card_owner
    data: One-time Google OAuth contacts scope and People API calls; searchContacts
      for configured sender addresses (reads matched contact names and emails
      during setup only); create or update a single We Met contact with those
      addresses; access token discarded after callback (no refresh token)
    purpose: optional Add We Met to my contacts setup after publish (DIDI-747)
    storage: We Met contact persists in the owner Google Contacts until the owner
      deletes it; accounts.contact_added_at and
      accounts.contact_sender_addresses in D1 only (no Google tokens)
    processors:
      - Google
      - Cloudflare
    retention: We Met contact in Google until owner deletes; D1 flags until account
      tombstone; Google tokens not stored per privacy page and ADR 0026
    who_can_see: card owner in Google Contacts; operator for D1 flags; Google as
      processor during setup API calls
    source: src/app-auth/google-people-api.ts
    verified: false
  - id: auth.google_sign_in
    whose: card_owner
    data: "Google OAuth: sub, email, name, email_verified from ID token; access
      tokens not persisted"
    purpose: account creation and sign-in
    storage: Google OAuth (transit); persisted fields in accounts table
    processors:
      - Google
      - Cloudflare
    retention: "persisted fields: until account deletion; OAuth tokens not stored
      per privacy page"
    who_can_see: operator; Google as processor
    source: src/app-auth/google-oauth.ts
    verified: true
  - id: binding.d1_we_met_db
    binding: WE_MET_DB
    whose: operational
    data: D1 database binding on production app and follow-up consumer Workers;
      card-owner and visitor personal data lives in d1_tables column rows, not in
      the binding itself
    purpose: primary application datastore (production routes and consumer)
    storage: D1 via Wrangler WE_MET_DB binding (database name in wrangler.jsonc)
    processors:
      - Cloudflare
    retention: per-column retention in d1_tables; binding has no separate retention
    who_can_see: operator
    source: wrangler.jsonc; workers/we-met-followup-email-consumer/wrangler.production.jsonc
    verified: true
  - id: binding.consumer_send_email
    whose: operational
    data: Cloudflare Workers send_email binding EMAIL on follow-up consumer Workers;
      carries outbound MIME (visitor and card owner PII in message bodies) when
      email_provider is cloudflare
    purpose: Cloudflare Email Service delivery from hello@mail.we-met.link
    storage: Cloudflare Email Service (in-transit send and delivery); post-delivery
      vendor logging in logs.cloudflare_email_sending_* rows when email_provider
      is cloudflare
    processors:
      - Cloudflare
      - Cloudflare Email Service
    retention: unknown — Email Service developer docs do not state how long full
      message bodies remain in Cloudflare systems after delivery; DPA Customer
      Content retention is until agreement expiry/termination or processing no
      longer necessary (https://www.cloudflare.com/cloudflare-customer-dpa/)
    who_can_see: Cloudflare as processor; card owner and visitor as recipients;
      operator via Email Service Activity log
    source: workers/we-met-followup-email-consumer/wrangler.production.jsonc;
      https://developers.cloudflare.com/email-service/observability/metrics-analytics/;
      https://developers.cloudflare.com/email-service/observability/logs/
    verified: false
  - id: binding.worker_assets
    binding: ASSETS
    whose: operational
    data: OpenNext static asset bundle served from ASSETS binding (no app user PII
      in binding)
    purpose: serve built JS/CSS and static files
    storage: Worker assets binding on app Worker
    processors:
      - Cloudflare
    retention: deployment lifetime
    who_can_see: public visitors
    source: wrangler.jsonc
    verified: true
  - id: binding.worker_images
    binding: IMAGES
    whose: card_owner
    data: Card photo bytes in transit through Cloudflare Images binding during
      ingestCardPhotoFromRequest
    purpose: validate and resize card photos before R2 write
    storage: Cloudflare Images (transit)
    processors:
      - Cloudflare
    retention: unknown (vendor processing retention not documented in repo)
    who_can_see: Cloudflare
    source: src/images/ingest-card-photo.ts
    verified: false
  - id: binding.worker_self_reference
    binding: WORKER_SELF_REFERENCE
    whose: operational
    data: Service binding WORKER_SELF_REFERENCE to we-met Worker (internal fetches;
      no separate data store)
    purpose: OpenNext self-invocation
    storage: Cloudflare Workers service binding
    processors:
      - Cloudflare
    retention: n/a
    who_can_see: operator
    source: wrangler.jsonc
    verified: true
  - id: browser.details_exchange_token
    whose: visitor
    data: Signed details token (leadToken) with visitor name and email, lead and
      card ids in the token payload (2h TTL); stored in sessionStorage JSON
      we-met-hi-exchange-session:<slug> alongside visitor firstName and
      visitorEmail, and ownerEmail / ownerPhone from the exchange response (for
      receipt Email/Call after redirect)
    purpose: receipt UI, second-step details form authorization, and token-gated
      owner vCard download (POST /api/exchange/vcard)
    storage: visitor browser sessionStorage only (single JSON key
      we-met-hi-exchange-session:<slug>; owner contact fields are not written to
      localStorage, the URL, logs, or analytics; cleared on expiry,
      ?vcard=expired, or explicit clear)
    processors:
      - Cloudflare
    retention: 2 hours or until cleared (src/exchange/token.ts); not stored
      server-side after issue
    who_can_see: visitor browser in the same tab
    source: src/lib/hi-card/exchange-session-storage.ts
    verified: false
  - id: browser.local_storage_app_theme
    whose: card_owner
    data: App editor theme preference key wemet-app-theme
    purpose: UI preference in app
    storage: visitor browser localStorage
    processors: []
    retention: until user clears site data
    who_can_see: card owner device
    source: src/lib/app-theme-storage-key.ts
    verified: true
  - id: browser.local_storage_chips_opened
    whose: visitor
    data: Flag card-chips-opened whether services chips were opened
    purpose: UX state on public card
    storage: visitor browser localStorage
    processors: []
    retention: until user clears site data
    who_can_see: visitor device
    source: src/components/hi/hi-chip-popover-position.ts
    verified: true
  - id: browser.local_storage_details_sent
    whose: visitor
    data: Per-slug flag we-met-hi-details-sent:<slug> = 1 after successful details
      step (no name, email, or token)
    purpose: show Contact sent on exchange UI for one-and-done details (DIDI-605)
    storage: visitor browser localStorage
    processors: []
    retention: until user clears site data
    who_can_see: visitor device only
    source: src/lib/hi-card/details-sent-storage.ts
    verified: true
  - id: browser.local_storage_exchange_completed
