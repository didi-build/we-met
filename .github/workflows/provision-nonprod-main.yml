name: Provision non-prod resources (main)

on:
  push:
    branches: [main]
    paths:
      - wrangler.jsonc
      - workers/**/wrangler.*.jsonc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: migrate-nonprod
    concurrency:
      group: migrate-nonprod-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Provision D1 and R2 (non-prod, main only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MIGRATE_NONPROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WE_MET_D1_DATABASE_ID_NONPROD: ${{ vars.WE_MET_D1_DATABASE_ID_NONPROD }}
        run: |
          set -euo pipefail
          node scripts/provision-resources.mjs \
            --target nonprod \
            --config wrangler.jsonc \
            --output provision-d1-ids.json
