name: Deploy consumer non-prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-consumer-nonprod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: consumer-nonprod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare follow-up email consumer Wrangler config (non-prod D1 ID)
        env:
          WE_MET_D1_DATABASE_ID_NONPROD: ${{ secrets.WE_MET_D1_DATABASE_ID_NONPROD }}
        run: |
          set -euo pipefail
          node scripts/prepare-wrangler-config.mjs \
            --target consumer-nonprod \
            --output workers/we-met-followup-email-consumer/wrangler.nonprod.ci.jsonc
      - name: Deploy-time guards (repo)
        run: npm run deploy:guards
      - name: Deploy-time guards (non-prod consumer config)
        run: |
          node scripts/check-deploy-guards.mjs \
            --target consumer-nonprod \
            --config workers/we-met-followup-email-consumer/wrangler.nonprod.ci.jsonc
      - name: Dry-run non-prod consumer bundle
        run: npm run worker:consumer-dry-run:nonprod
      - name: Require consumer Worker secrets (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_CONSUMER_NONPROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SECRET_LIST_STDOUT=$(mktemp)
          SECRET_LIST_STDERR=$(mktemp)
          if ! npx wrangler secret list --name we-met-followup-email-consumer-nonprod \
            >"$SECRET_LIST_STDOUT" 2>"$SECRET_LIST_STDERR"; then
            echo "::error::wrangler secret list failed for Worker we-met-followup-email-consumer-nonprod using CLOUDFLARE_API_TOKEN_CONSUMER_NONPROD. Non-prod follow-up consumer deploy was stopped. See docs/decisions/0017-cloudflare-api-credentials.md for token scoping."
            grep -oE '\[code: [0-9]+\]' "$SECRET_LIST_STDERR" | sort -u || true
            exit 1
          fi
          export SECRET_LIST_STDOUT
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const required = [
              'WE_MET_EMAIL_FROM_CLOUDFLARE',
              'WE_MET_FROM_DISPLAY_NAME',
              'WE_MET_TEST_MAIL_TO',
            ];
            const raw = readFileSync(process.env.SECRET_LIST_STDOUT, 'utf8');
            const firstBracket = raw.indexOf('[');
            const lastBracket = raw.lastIndexOf(']');
            if (firstBracket === -1 || lastBracket === -1 || lastBracket < firstBracket) {
              console.error('::error::Could not locate a JSON array in wrangler secret list stdout for we-met-followup-email-consumer-nonprod. Non-prod follow-up consumer deploy was stopped.');
              process.exit(1);
            }
            const jsonText = raw.slice(firstBracket, lastBracket + 1);
            let parsed;
            try {
              parsed = JSON.parse(jsonText);
            } catch {
              console.error('::error::wrangler secret list stdout was not valid JSON for we-met-followup-email-consumer-nonprod. Non-prod follow-up consumer deploy was stopped.');
              process.exit(1);
            }
            if (!Array.isArray(parsed)) {
              console.error('::error::Unexpected wrangler secret list shape for we-met-followup-email-consumer-nonprod; expected a JSON array. Non-prod follow-up consumer deploy was stopped.');
              process.exit(1);
            }
            const names = new Set(parsed.map((entry) => entry?.name).filter(Boolean));
            const missing = required.filter((name) => !names.has(name));
            if (missing.length > 0) {
              for (const name of missing) {
                console.error('::error::Missing required Worker secret on we-met-followup-email-consumer-nonprod: ' + name + '. Non-prod follow-up consumer deploy was stopped.');
              }
              process.exit(1);
            }
            console.log('All required consumer secret names are present (' + required.length + ').');
          "
      - name: Deploy follow-up email consumer to non-prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_CONSUMER_NONPROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WRANGLER_CONFIG="workers/we-met-followup-email-consumer/wrangler.nonprod.ci.jsonc"
          DEPLOY_LOG=$(mktemp)
          if ! npx wrangler deploy \
            --config "$WRANGLER_CONFIG" \
            --message "main ${GITHUB_SHA}" \
            --tag "${GITHUB_SHA}" \
            2>&1 | tee "$DEPLOY_LOG"; then
            echo "::error::wrangler deploy failed for we-met-followup-email-consumer-nonprod"
            exit 1
          fi
          VERSION_ID=$(grep -E 'Current Version ID:' "$DEPLOY_LOG" | sed -n 's/.*Current Version ID: //p' | tail -1 || true)
          if [ -z "$VERSION_ID" ]; then
            echo "::warning::Could not parse Current Version ID from wrangler deploy output; check the deploy step log."
            VERSION_ID="unknown"
          fi
          {
            echo "## Non-prod follow-up email consumer deploy"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Wrangler tag | \`${GITHUB_SHA}\` |"
            echo "| Version ID | \`${VERSION_ID}\` |"
            echo "| Worker | \`we-met-followup-email-consumer-nonprod\` |"
          } >> "$GITHUB_STEP_SUMMARY"
