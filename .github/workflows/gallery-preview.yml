name: Gallery preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: gallery-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gallery-preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.preview.outputs.preview_url }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GALLERY_PROBE_MARKER: we-met-gallery-bundle-probe
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Detect preview credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CF_TOKEN}" ] && [ -n "${CF_ACCOUNT}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm ci
        if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - name: Gallery deploy guards
        if: steps.creds.outputs.ready == 'true'
        run: npm run gallery:guards
      - name: Build gallery assets
        if: steps.creds.outputs.ready == 'true'
        run: npm run gallery:build
      - name: Create or update gallery Preview
        id: preview
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          output="$(npx wrangler preview \
            --config wrangler.gallery.jsonc \
            --name "gallery-pr-${PR_NUMBER}" \
            --json 2>&1)"
          preview_status=$?
          set -e
          if [ "${preview_status}" -ne 0 ]; then
            printf '%s\n' "$output"
            exit "${preview_status}"
          fi
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | node scripts/parse-wrangler-preview-json.mjs)"
          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"
      - name: Probe gallery route
        id: probe
        if: steps.creds.outputs.ready == 'true' && steps.preview.outcome == 'success'
        run: |
          set -euo pipefail
          curl_common=(--fail --show-error --silent --location --retry 3 --retry-delay 5 --retry-all-errors)
          gallery_headers="$(curl "${curl_common[@]}" -sSI "${PREVIEW_URL}/gallery/")"
          if ! grep -qi 'x-robots-tag:.*noindex' <<<"$gallery_headers"; then
            echo "Expected X-Robots-Tag with noindex on /gallery/ (Workers Preview workers.dev default)."
            printf '%s\n' "$gallery_headers"
            exit 1
          fi
          gallery_html="$(curl "${curl_common[@]}" "${PREVIEW_URL}/gallery/")"
          if ! grep -qiE 'name="robots"[^>]*content="[^"]*nofollow' <<<"$gallery_html"; then
            echo "Expected <meta name=\"robots\" … nofollow> in /gallery/ HTML (nofollow is not on Preview response headers)."
            exit 1
          fi
          if grep -q "${GALLERY_PROBE_MARKER}" <<<"$gallery_html"; then
            echo "Gallery probe marker must not appear in SPA HTML (only in built assets)."
            exit 1
          fi
          js_path="$(grep -oE -m1 '/gallery/assets/index-[^"]+\.js' <<<"$gallery_html")"
          if [ -z "$js_path" ]; then
            echo "Could not find gallery JS asset in /gallery HTML."
            exit 1
          fi
          js_body="$(curl "${curl_common[@]}" "${PREVIEW_URL%/}${js_path}")"
          grep -q "${GALLERY_PROBE_MARKER}" <<<"$js_body"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
      - name: Gallery preview check (deployed)
        if: ${{ !cancelled() && steps.creds.outputs.ready == 'true' && steps.preview.outcome == 'success' && steps.probe.outcome == 'success' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const galleryUrl = `${process.env.PREVIEW_URL.replace(/\/$/, '')}/gallery`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'gallery-preview',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Gallery preview',
                summary: `[Open component gallery](${galleryUrl})`,
              },
            });
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
      - name: Gallery preview check (unconfigured)
        if: ${{ !cancelled() && steps.creds.outputs.ready != 'true' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'gallery-preview',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Gallery preview not configured',
                summary:
                  'Set secrets `CLOUDFLARE_API_TOKEN_PREVIEW` and `CLOUDFLARE_ACCOUNT_ID` on the GitHub preview environment to enable gallery previews.',
              },
            });
      - name: Set preview summary mode
        id: mode
        if: ${{ !cancelled() }}
        run: node scripts/gallery-preview-mode.mjs >> "$GITHUB_OUTPUT"
        env:
          CREDS_READY: ${{ steps.creds.outputs.ready }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
      - name: Build gallery preview summary
        id: summary
        if: ${{ !cancelled() }}
        run: node scripts/gallery-preview-summary.mjs >> "$GITHUB_OUTPUT"
        env:
          PREVIEW_MODE: ${{ steps.mode.outputs.mode }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Find gallery preview comment
        id: find-comment
        if: ${{ !cancelled() }}
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- we-met-gallery-preview -->"
      - name: Update gallery preview comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        if: ${{ !cancelled() }}
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: ${{ steps.summary.outputs.body }}
      - name: Fail if preview deploy or probe failed
        if: ${{ !cancelled() && steps.creds.outputs.ready == 'true' && (steps.preview.outcome != 'success' || steps.probe.outcome == 'failure') }}
        run: exit 1

  gallery-cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Detect preview credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CF_TOKEN}" ] && [ -n "${CF_ACCOUNT}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm ci
        if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - name: Delete gallery Preview
        if: steps.creds.outputs.ready == 'true'
        run: node scripts/wrangler-preview-delete.mjs
        env:
          PREVIEW_NAME: gallery-pr-${{ env.PR_NUMBER }}
          WRANGLER_CONFIG: wrangler.gallery.jsonc
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
