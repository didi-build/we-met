name: Deploy production

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - id: checkout
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: setup-node
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: npm-ci
        continue-on-error: true
        timeout-minutes: 5
        run: npm ci
      - name: Plan checkout fallback notice
        if: always() && steps.checkout.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::PLAN FAILED: checkout failed before the plan could run. Check migrations/ by hand before approving."
          {
            echo "## Production D1 migration plan"
            echo ""
            echo "**PLAN FAILED: checkout failed before the plan could run.**"
            echo ""
            echo "Check migrations/ by hand before approving."
            echo ""
            echo "_The deploy job is not blocked; production approval remains the gate._"
          } >> "$GITHUB_STEP_SUMMARY"
      - id: plan-script
        name: Plan production D1 migrations
        continue-on-error: true
        timeout-minutes: 5
        if: >-
          steps.checkout.outcome == 'success' &&
          steps.setup-node.outcome == 'success' &&
          steps.npm-ci.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: npx tsx scripts/deploy-production/plan.ts
      - name: Report plan job setup failure
        continue-on-error: true
        if: >-
          always() && (
          steps.checkout.outcome == 'failure' ||
          steps.setup-node.outcome == 'failure' ||
          steps.npm-ci.outcome == 'failure' ||
          steps.plan-script.outcome == 'failure')
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup-node.outcome }}
          NPM_CI_OUTCOME: ${{ steps.npm-ci.outcome }}
          PLAN_STEP_OUTCOME: ${{ steps.plan-script.outcome }}
        run: node scripts/deploy-production/report-setup-failure.mjs

  deploy:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare Wrangler config (production D1 IDs)
        env:
          WE_MET_D1_DATABASE_ID_PRODUCTION: ${{ vars.WE_MET_D1_DATABASE_ID_PRODUCTION }}
        run: |
          set -euo pipefail
          node scripts/prepare-wrangler-config.mjs \
            --target production \
            --output wrangler.ci.jsonc
      - name: Deploy-time guards (production)
        run: node scripts/check-deploy-guards.mjs --target production --config wrangler.ci.jsonc
      - name: Prepare follow-up email consumer Wrangler config (production D1 ID)
        env:
          WE_MET_D1_DATABASE_ID_PRODUCTION: ${{ vars.WE_MET_D1_DATABASE_ID_PRODUCTION }}
        run: |
          set -euo pipefail
          node scripts/prepare-wrangler-config.mjs \
            --target consumer-production \
            --output workers/we-met-followup-email-consumer/wrangler.production.ci.jsonc
      - name: Deploy-time guards (production consumer)
        run: |
          node scripts/check-deploy-guards.mjs \
            --target consumer-production \
            --config workers/we-met-followup-email-consumer/wrangler.production.ci.jsonc
      - name: Require production Turnstile site key
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.WE_MET_TURNSTILE_SITE_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_TURNSTILE_SITE_KEY}" ]; then
            echo "::error::NEXT_PUBLIC_TURNSTILE_SITE_KEY (WE_MET_TURNSTILE_SITE_KEY_PRODUCTION) is empty"
            exit 1
          fi
      - name: Build OpenNext (production Turnstile site key)
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.WE_MET_TURNSTILE_SITE_KEY_PRODUCTION }}
        run: npm run build
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply WE_MET_DB --remote \
            --config wrangler.ci.jsonc
      - name: Deploy Worker to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx opennextjs-cloudflare deploy --config wrangler.ci.jsonc
      - name: Deploy follow-up email consumer to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_CONSUMER_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --config workers/we-met-followup-email-consumer/wrangler.production.ci.jsonc
